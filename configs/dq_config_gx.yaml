schema_version: 1

project:
  name: enterprise_dq_gx_demo

execution:
  mode: tool
  tool: great_expectations
  fail_on_critical: false
  fail_on_critical_drift: false

tool_config:
  great_expectations:
    execution_mode: translate_only
    artifact_dir: ../outputs/tool_artifacts/great_expectations
    # execute_checkpoint is an extension point because GX contexts/checkpoints
    # are usually repo-specific.

outputs:
  json_path: ../outputs/gx/dq_results.json
  rule_results_csv: ../outputs/gx/dq_rule_results.csv
  scorecard_csv: ../outputs/gx/dq_scorecard.csv
  failed_rows_dir: ../outputs/gx/failed_rows

drift:
  enabled: true
  history_path: ../outputs/gx/history/dq_run_history.json
  drift_output_path: ../outputs/gx/drift/drift_report.json

datasets:
  - name: orders
    rules_file: ../rules/orders_rules.yaml
