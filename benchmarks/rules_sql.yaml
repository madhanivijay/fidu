schema_version: 1

dataset: bench_orders_sql

source:
  type: bench_duckdb_parquet  # registered by benchmarks/run_sql.py at runtime
  table: bench_orders         # rewritten by benchmarks/run_sql.py at runtime

rules:
  - name: order_id_not_null
    type: not_null
    column: order_id
    dimension: completeness
    severity: critical

  - name: order_id_unique
    type: unique
    column: order_id
    dimension: uniqueness
    severity: critical

  - name: customer_id_not_null
    type: not_null
    column: customer_id
    dimension: completeness
    severity: warning

  - name: amount_in_range
    type: between
    column: amount
    min_value: 0
    max_value: 1000
    dimension: validity
    severity: warning

  - name: valid_status
    type: accepted_values
    column: status
    values: [new, shipped, delivered, canceled]
    dimension: validity
    severity: warning

  - name: minimum_row_count
    type: row_count_min
    value: 1
    dimension: volume
    severity: critical
