name: Publish

# Publishes the kit as an sdist + wheel to TestPyPI on every tag, and to
# real PyPI when the tag matches the kit version in `pyproject.toml`.
#
# Trigger by pushing a tag like `v0.1.0` or `v0.1.0rc1`. Pre-release tags
# (anything containing `rc`, `a`, `b`, `dev`) only go to TestPyPI so we
# can validate install flow before promoting.
#
# Both jobs use PyPI Trusted Publishing (OIDC) — no API tokens stored as
# secrets. Configure the publisher under
# https://test.pypi.org/manage/account/publishing/ and
# https://pypi.org/manage/account/publishing/ with:
#   - Owner / repo / workflow filename: publish.yml
#   - Environment name: testpypi (and pypi for the prod job)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read_version.outputs.version }}
      is_prerelease: ${{ steps.read_version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Read package version
        id: read_version
        run: |
          version=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if echo "$version" | grep -E '(rc|a|b|dev)' > /dev/null; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Building fidu $version"

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="${{ steps.read_version.outputs.version }}"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match pyproject version $pkg"
            exit 1
          fi

      - name: Build distributions
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    # Run for every tag push and for manual dispatches that target testpypi.
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fidu
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  smoke-test-testpypi:
    name: Smoke install from TestPyPI
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for TestPyPI index to update
        run: sleep 30

      - name: Install from TestPyPI
        run: |
          python -m pip install --upgrade pip
          # --extra-index-url so runtime deps (pandas, pyyaml, ...) still
          # resolve from real PyPI; only the kit comes from TestPyPI.
          pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "fidu==${{ needs.build.outputs.version }}"

      - name: Verify entry point + import
        run: |
          fidu --help || true
          python -c "import fidu, fidu.core, fidu.connectors, fidu.engines, fidu.drift, fidu.translators, fidu.tool_adapters; print('import ok')"

  publish-pypi:
    name: Publish to PyPI
    needs: [build, publish-testpypi, smoke-test-testpypi]
    runs-on: ubuntu-latest
    # Promote to real PyPI only for non-prerelease tags, or when manually
    # dispatched with target=pypi.
    if: |
      (startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.is_prerelease == 'false') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/p/fidu
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
