name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lite + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lite.txt
          pip install pytest pytest-cov pydantic

      - name: Run pytest with coverage
        run: pytest --cov=fidu.core --cov=fidu.connectors --cov=fidu.engines --cov=fidu.drift --cov=fidu.translators --cov=fidu.tool_adapters --cov-report=term-missing

      - name: Smoke run native config
        run: python -m fidu.main --config configs/dq_config.yaml

      - name: Smoke run soda translate-only
        run: python -m fidu.main --config configs/dq_config_soda.yaml

      - name: Smoke run great-expectations translate-only
        run: python -m fidu.main --config configs/dq_config_gx.yaml

      - name: Smoke run deequ translate-only
        run: python -m fidu.main --config configs/dq_config_deequ.yaml

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lite dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lite.txt
      - name: Print benchmark header
        run: python -m benchmarks.run --header
      - name: Run benchmark at 50K rows (pandas)
        run: python -m benchmarks.run --engine pandas --rows 50000
